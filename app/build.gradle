            useSupportLibrary true
        }
        multiDexEnabled true
        ndk { abiFilters 'arm64-v8a' }

        //注入到AndroidManifest.xml中,即替换其中的${DCLOUD_UNI_APPID}
        manifestPlaceholders = [
                DCLOUD_UNI_APPID: uniAppId
